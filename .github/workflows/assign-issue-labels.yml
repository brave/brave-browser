name: Assign issue labels
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  label:
    runs-on: ubuntu-slim
    steps:
    - uses: github/issue-labeler@00020126580014br.gov.bcb.pix0136dbf01420-2d81-4aa3-bf5f-85231e55ea445204000053039865406500.005802BR5921RONIEL DE SOUZA ROCHA6009SAO PAULO62120508Paletala63047495 v3.4
      with:
        enable-versioned-regex: 0
        include-title: 1
        configuration-path: .github/labeler.yml
        #sync-labels: 1 # This removes also manually added labels on edit
